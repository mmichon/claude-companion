name: ClaudeCompanion
options:
  bundleIdPrefix: com.mmichon
  deploymentTarget:
    iOS: "17.0"
packages:
  ClaudeCompanionKit:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: V5TV2ZP49S
    SWIFT_VERSION: "5.0"
targets:
  ClaudeCompanion:
    type: application
    platform: iOS
    sources: [ClaudeCompanion]
    dependencies:
      - package: ClaudeCompanionKit
        product: CompanionShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmichon.claudecompanion
        PRODUCT_NAME: ClaudeCompanion
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Companion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Companion connects to Claude on your Mac over the local network to show session status."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Companion adds a reminder for when your Claude usage window resets."
    info:
      path: ClaudeCompanion/Info.plist
      properties:
        NSBonjourServices: [_claudecompanion._tcp]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
